name: matracking
description: "A public transport tracking and booking app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Animations
  cupertino_icons: ^1.0.8
  flutter_spinkit: ^5.2.1
  qr_flutter: ^4.1.0
  page_transition: ^2.2.1
  flutter_vector_icons: ^2.0.0
  font_awesome_flutter: ^10.7.0
  flutter_animate: ^4.5.2
  animations: ^2.0.11
  google_fonts: ^6.2.1
  provider: ^6.1.4
  flutter_svg: ^2.0.17
  fluttertoast: ^8.0.9

  # Permissions & Notifications
  permission_handler: ^11.3.1
  flutter_local_notifications: ^19.0.0
  firebase_messaging: ^15.2.4  

  # Firebase & Authentication
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  firebase_database: ^11.3.4
  cloud_firestore: ^5.6.6
  google_sign_in: ^6.2.1

  # Maps & Location
  flutter_map: ^8.1.1
  latlong2: ^0.9.0
  geolocator: ^13.0.4

  # App Icon & Splash Screen
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/bus_marker.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/logo.png"
  android: true
  ios: true
  fullscreen: true
  android_12:
    image: "assets/logo.png"
    icon_background_color: "#ffffff"

dependency_overrides:
  # Remove unnecessary overrides unless you face specific issues
  # async: ^2.13.0
  # fake_async: ^1.3.3
  # geolocator_android: ^5.0.1
  # leak_tracker: ^10.0.9
  # material_color_utilities: ^0.12.0
  # permission_handler_android: ^13.0.1
  # unicode: ^1.1.8
  # vm_service: ^15.0.0
